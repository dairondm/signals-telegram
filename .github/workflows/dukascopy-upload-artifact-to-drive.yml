name: Subir artifact de Dukascopy existente a Drive

# Sube a Google Drive un CSV que ya se generó en una corrida anterior del
# workflow de descarga (guardado como artifact de esa corrida), sin volver
# a descargar ni convertir nada. Útil cuando la descarga ya se hizo pero
# la subida a Drive falló o no estaba configurada todavía.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de la corrida de GitHub Actions donde está el artifact"
        required: true
        default: "33203324370"
      artifact_name:
        description: "Nombre del artifact a subir"
        required: true
        default: "XAUUSD-tickdata-csv"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r dukascopy/requirements.txt

      - name: Descargar el artifact de la corrida indicada
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dukascopy_data/csv

      - name: Subir a Google Drive
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          FILE=$(find dukascopy_data/csv -name '*.csv' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No se encontró ningún .csv dentro del artifact descargado." >&2
            exit 1
          fi
          python dukascopy/upload_to_drive.py \
            --file "$FILE" \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}"
