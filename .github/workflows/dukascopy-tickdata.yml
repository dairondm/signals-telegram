name: Descarga de tick data de Dukascopy

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Código del instrumento en Dukascopy"
        required: true
        default: "XAUUSD"
      start_date:
        description: "Fecha de inicio (YYYY-MM-DD, inclusive)"
        required: true
        default: "2026-01-01"
      end_date:
        description: "Fecha de fin (YYYY-MM-DD, inclusive). Deja vacío para usar hoy."
        required: false
        default: ""
      upload_raw_bi5:
        description: "También comprimir y subir a Drive los archivos .bi5 crudos"
        type: boolean
        required: false
        default: true

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r dukascopy/requirements.txt

      - name: Resolver fecha de fin
        id: dates
        run: |
          if [ -z "${{ github.event.inputs.end_date }}" ]; then
            echo "end_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          else
            echo "end_date=${{ github.event.inputs.end_date }}" >> "$GITHUB_OUTPUT"
          fi

      # Conserva los archivos crudos entre re-ejecuciones de este workflow
      # para que una corrida fallida o cortada por timeout pueda reanudar
      # en vez de descargar todo de nuevo.
      - name: Cachear tick data cruda
        uses: actions/cache@v4
        with:
          path: dukascopy_data/raw
          key: dukascopy-raw-${{ github.event.inputs.symbol }}-${{ github.event.inputs.start_date }}-${{ steps.dates.outputs.end_date }}

      - name: Descargar archivos .bi5 crudos
        run: |
          python dukascopy/download_bi5.py \
            --symbol "${{ github.event.inputs.symbol }}" \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ steps.dates.outputs.end_date }}" \
            --out-dir dukascopy_data/raw \
            --concurrency 16

      - name: Convertir a CSV
        run: |
          python dukascopy/convert_to_csv.py \
            --symbol "${{ github.event.inputs.symbol }}" \
            --in-dir dukascopy_data/raw \
            --out-csv dukascopy_data/csv/${{ github.event.inputs.symbol }}_${{ github.event.inputs.start_date }}_${{ steps.dates.outputs.end_date }}.csv

      - name: Comprimir archivos .bi5 crudos
        if: ${{ github.event.inputs.upload_raw_bi5 == 'true' }}
        run: |
          zip -r -q dukascopy_data/${{ github.event.inputs.symbol }}_${{ github.event.inputs.start_date }}_${{ steps.dates.outputs.end_date }}_raw.zip \
            dukascopy_data/raw/${{ github.event.inputs.symbol }}

      - name: Subir CSV a Google Drive
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python dukascopy/upload_to_drive.py \
            --file dukascopy_data/csv/${{ github.event.inputs.symbol }}_${{ github.event.inputs.start_date }}_${{ steps.dates.outputs.end_date }}.csv \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}"

      - name: Subir zip de .bi5 crudos a Google Drive
        if: ${{ github.event.inputs.upload_raw_bi5 == 'true' }}
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python dukascopy/upload_to_drive.py \
            --file dukascopy_data/${{ github.event.inputs.symbol }}_${{ github.event.inputs.start_date }}_${{ steps.dates.outputs.end_date }}_raw.zip \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}"

      # Respaldo para que los datos sigan siendo recuperables aunque la
      # subida a Drive o los secrets aún no estén configurados. Los
      # artifacts expiran a los 90 días por defecto.
      - name: Subir CSV como artifact del workflow (respaldo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.symbol }}-tickdata-csv
          path: dukascopy_data/csv/*.csv
          retention-days: 30
